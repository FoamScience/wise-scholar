[project]
name = "wise-scholar"
version = "0.1.0"
description = "Self-hosted AI tutor: research-grounded learning mechanisms driven by agent backends"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
